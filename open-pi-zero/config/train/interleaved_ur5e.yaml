defaults:
  - _self_
hydra:
  run:
    dir: ${log_dir}
_target_: src.agent.interleaved_train.InterleavedTrainAgent

log_dir: ${oc.env:VLA_LOG_DIR}/train/${name}/${now:%Y-%m-%d}_${now:%H-%M}_${seed}
name: ${data.train.dataset_mix}_${data.train.split}_tp${horizon_steps}_${flow_sampling}
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: ${oc.env:TRANSFORMERS_CACHE}/paligemma-3b-pt-224
load_pretrained_weights: True
resume_checkpoint_path: ${oc.env:INTERLEAVE_CHECKPOINT}
resume_checkpoint_step: False

# The Bridge checkpoint has no LoRA parameters.
# Set to False when doing a true resume from an UR5e LoRA checkpoint.
allow_missing_lora_weights: True

freeze_vision_model: False # with LoRA, keep the vision LoRA adapters trainable
train_vlm: True
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
use_torch_compile: True
use_bf16: True
use_amp: True
quantize: False
lora: True
lora_r: 32
lora_dropout: 0.0
debug: False

use_ema: False
ema_decay: 0.99
ema_start: ${updates_per_epoch}
ema_freq: 1
ema_device: cuda
use_swa: False
swa_start: ${eval:'${updates_per_epoch} * (${n_epochs} * 3 // 4)'}
swa_freq: ${eval:'max(${updates_per_epoch} // 4, 1)'}
swa_device: cpu

data:
  val:
    split:  # null selects the explicit TFDS val split when train=False
    shuffle_buffer_size: 1000
  train:
    dataset_mix: ur5e_interleave
    split: train
    data_path: ${oc.env:VLA_DATA_DIR}

    window_size: ${cond_steps}
    action_horizon: ${horizon_steps}
    skip_unlabeled: True
    load_proprio: True

    # Finite training dataset: required by task-balanced oversampling.
    repeat_dataset: False

    # Each optimizer update receives exactly one sample from each task.
    balance_by_task: True
    balance_seed: ${seed}

    task_sample_counts:
      0: 1906
      1: 1808
      2: 2124
      3: 1988
      4: 2134
      5: 1844
      6: 2208
      7: 1837
      8: 1936
      9: 2075
      10: 1938
      11: 2199

    samples_per_task: 2208

    shuffle_buffer_size: 10000
    num_parallel_calls: 4
    traj_transform_threads: 4
    traj_read_threads: 4

wandb:
  entity: ${oc.env:VLA_WANDB_ENTITY}
  project: open-pi-zero
  run: ${now:%H-%M-%S}_${name}

log_freq: 120  # counted in microbatches: every 10 updates with the single-GPU batch settings below

num_original_train_samples: 23997  # original flattened train samples before task balancing
num_balanced_train_samples: 26496  # samples produced per epoch after task balancing

n_epochs: 30  # logical dataset passes used only to derive n_updates
# 26496 samples / global batch 12 = 2208 optimizer updates per epoch.
updates_per_epoch: 2208
n_updates: ${eval:'${updates_per_epoch} * ${n_epochs}'}

save_every_n_epochs: 1
save_model_freq: ${eval:'${updates_per_epoch} * ${save_every_n_epochs}'}
save_model_start: 0  # the trainer uses cnt_update > save_model_start, so this includes the first epoch

eval_every_n_epochs: 1
# eval_freq is counted in optimizer updates.
eval_freq: ${eval:'${updates_per_epoch} * ${eval_every_n_epochs}'}
num_val_samples: 1227
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

global_batch_size: 12
per_device_batch_size: 1
# world_size: 8 # for deepspeed
action_lr: 5e-5
vlm_lr: 5e-5
action_lr_scheduler:
  first_cycle_steps: 10000000 # basically no decaying
  min_lr: 1e-8
  warmup_steps: 200 # a bit of warmup
vlm_lr_scheduler:
  first_cycle_steps: 10000000
  min_lr: 1e-8
  warmup_steps: 200
action_weight_decay: 0
vlm_weight_decay: 0
max_grad_norm: 1.0

flow_sampling: beta
num_inference_steps: 10
final_action_clip_value: 1.0  # data normalized in [-1,1]

cond_steps: 1
horizon_steps: 4
action_dim: 7   # delta xyz + delta RPY + gripper
proprio_dim: 7  # absolute xyz + RPY + gripper
max_seq_len: 540  # 256 observation-image tokens + 256 instruction-image tokens + text/special tokens
tokenizer_padding: max_length # instead of truncating to longest
max_image_text_tokens: ${max_seq_len}

mixture:
  vlm:   # gemma
    hidden_size: 2048
    intermediate_size: 16384
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:  # not applicable for gemma
    rope_theta: 10000.0  # 10000 in gemma
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True  # technically no, but sharing weights with action anyway
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
    rope_theta: ${action_expert_rope_theta}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
    rope_theta: ${action_expert_rope_theta}
time_hidden_size: 256 # only applicable if using adaptive
time_max_period: 100.0
action_expert_rope_theta: 100.0   # since action/proprio seq_len is pretty small

# Fixed
image_token_index: 257152
vocab_size: 257216
pad_token_id: 0
# hidden_size: 2048 # for deepspeed

vision:
  _target_: src.model.paligemma.siglip.SiglipVisionModel
  config:
    hidden_size: 1152 # siglip
    intermediate_size: 4304
    num_hidden_layers: 27
    num_attention_heads: 16
    num_channels: 3
    image_size: 224
    patch_size: 14
    layer_norm_eps: 1e-6
    attention_dropout: 0.0
    num_image_tokens: 256
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}

vision_projector:
  _target_: src.model.paligemma.siglip.PaliGemmaMultiModalProjector
  config:
    vision_config:
      hidden_size: 1152
      projection_dim: 2048
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}

joint:
  _target_: src.model.vla.joint_model.JointModel
  config:
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    #
    num_hidden_layers: 18
    num_attention_heads: 8
    num_key_value_heads: 1
    head_dim: 256
    rms_norm_eps: 1e-6
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
